[build-system]
requires = ["setuptools>=71,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "vlarobot"
version = "0.1.0"
description = "An educational Isaac Sim → LeRobotDataset → SmolVLA manipulation lab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot[smolvla,training]==0.6.1",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "torchcodec==0.11.0",
  "PyYAML>=6,<7",
  "imageio>=2.37,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
